name: Publish near-final FlashBridge RC2
# One-time maintenance: only when this workflow file changes on main.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rc2.yml']
permissions:
  contents: write
jobs:
  publish:
    name: Build and publish unsigned RC2
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Run synthetic tests
        shell: pwsh
        run: |
          python -m py_compile flashbridge_core.py flashbridge_gui.py flashbridge_gui.pyw flashbridge_i18n.py flashbridge_inspector.py flashbridge_imdisk_setup.py
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Synthetic tests failed" }
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller install failed" }
          python -m PyInstaller --clean --noconfirm --onefile --windowed --uac-admin --noupx --name FlashBridge --icon assets/flashbridge.ico flashbridge_gui.pyw
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
      - name: Stage EXE, documentation and SHA256
        shell: pwsh
        run: |
          $exe = "dist/FlashBridge.exe"
          if (!(Test-Path $exe)) { throw "FlashBridge.exe is missing" }
          $header = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($header[0] -ne 77 -or $header[1] -ne 90) { throw "Not a Windows MZ executable" }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item $exe,"README.md","README.cs.md","RELEASE_NOTES.md","LICENSE" -Destination release/
          $hash = (Get-FileHash release/FlashBridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FlashBridge.exe" | Out-File -FilePath release/SHA256.txt -Encoding ascii
          Compress-Archive -Path release/* -DestinationPath FlashBridge-v0.3.3-rc2-Windows-x64-UNSIGNED.zip -Force
          if (!(Test-Path FlashBridge-v0.3.3-rc2-Windows-x64-UNSIGNED.zip)) { throw "ZIP missing" }
      - name: Publish persistent prerelease (not stable)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.3-rc2 FlashBridge-v0.3.3-rc2-Windows-x64-UNSIGNED.zip release/FlashBridge.exe release/SHA256.txt --title "FlashBridge v0.3.3-rc2 - near-final AS IS (unsigned)" --notes-file RELEASE_NOTES.md --prerelease --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed; branches will not be deleted" }
  cleanup-legacy-branches:
    name: Retire obsolete pointers after successful prerelease
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ancestry of legacy branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          for branch in release/flashbridge-v0.3.3-rc1 release/v0.3.1-alpha-fused-io; do
            git merge-base --is-ancestor "origin/$branch" HEAD || { echo "STOP: $branch not in main history"; exit 1; }
          done
      - name: Retire only the two named old branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in release/flashbridge-v0.3.3-rc1 release/v0.3.1-alpha-fused-io; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Retired $branch (commits preserved in main)"
          done
